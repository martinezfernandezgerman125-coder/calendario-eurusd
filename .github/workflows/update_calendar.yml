name: Actualizar calendario EUR-USD

on:
  schedule:
    # Todos los dias a las 06:00 UTC (08:00 hora de Espana en invierno,
    # 07:00 en verano). GitHub puede retrasarlo unos minutos, es normal.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permite lanzarlo a mano desde GitHub si quieres probarlo ya

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 icalendar pytz

      - name: Ejecutar el script de actualizacion
        run: python scripts/update_calendar.py

      - name: Guardar cambios en el repositorio (si los hay)
        run: |
          git config user.name "eurusd-calendario-bot"
          git config user.email "bot@users.noreply.github.com"
          git add EURUSD_calendario_completo_v3.ics
          git diff --cached --quiet || git commit -m "Actualizacion automatica del calendario"
          git push
